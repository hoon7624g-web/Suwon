# 매일 다시 빌드 — 한국 시간 0시 5분에 public/(공개 빌드)을 새 날짜로 다시 만들어 main에 올린다(Vercel이 배포).
# 날짜가 바뀌면 달라지는 것(지난 행사 빠짐, '다음 행사', 계절 표 등)을 사람 손 없이 맞추려는 것이다.
# 데이터(data/)는 바꾸지 않는다. 검증 오류가 있으면(build_public 종료 코드 1) 올리지 않는다.
name: daily-rebuild

on:
  schedule:
    - cron: "5 15 * * *"   # 15:05 UTC = 00:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: build public (production) + validate
        run: python tools/build_public.py --data data/suwon --out public
      - name: commit and push if public changed
        run: |
          if [ -z "$(git status --porcelain -- public)" ]; then
            echo "public/ 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          git commit -q -m "build(public): 매일 다시 빌드 $(date +%F) (한국 시간)"
          git pull -q --rebase origin main
          git push origin HEAD:main
